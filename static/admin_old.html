<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель управления рулеткой</title>
    <!-- Подключаем стили Bootstrap 5 для красивого интерфейса -->
    <link href="/static/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1e1e24; color: #f8f9fa; }
        .card { background-color: #2a2a35; border: 1px solid #3a3a45; color: #fff; }
        .nav-link { color: #aaa; }
        .nav-link.active { background-color: #ffc107 !important; color: #000 !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="container mt-5" style="max-width: 800px;">
    <h1 class="mb-4 text-warning text-center">🎛️ Панель управления Roulette-Go</h1>

    <!-- 1. Навигация по табам (вкладкам) -->
    <ul class="nav nav-pills mb-4 justify-content-center" id="adminTabs" role="tablist">
        <li class="nav-item">
            <button class="nav-link active me-2" id="settings-tab" data-bs-toggle="tab" data-bs-target="#settings-content" type="button">⚙️ Настройки</button>
        </li>
        <li class="nav-item">
            <button class="nav-link me-2" id="templates-tab" data-bs-toggle="tab" data-bs-target="#templates-content" type="button">🎨 Шаблоны</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="manual-tab" data-bs-toggle="tab" data-bs-target="#manual-content" type="button">🕹️ Ручной режим</button>
        </li>
    </ul>

    <!-- 2. Содержимое вкладок -->
    <div class="tab-content" id="adminTabsContent">
        
        <!-- ТАБ 1: Настройки и выбор активного шаблона -->
        <div class="tab-pane fade show active" id="settings-content" role="tabpanel">
            <div class="card p-4 shadow">
                
                <form method="POST" action="/api/save-config">
                    <h3 class="mb-3 text-warning">Основные параметры</h3>

                    <!-- Поле для порта -->
                     <div class="mb-3">
                        <label class="form-label">Локальный порт:</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" name="server_port" value="{{.ServerPort}}">
                    </div>

                    <!-- Поле для токена -->
                     <div class="mb-3">
                        <label class="form-label">DA токен:</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" name="da_token" value="{{.SocketConnectionToken}}">
                    </div>

                    <!-- Поле для ID пользователя -->
                    <div class="mb-3">
                        <label class="form-label">DA ID пользователя:</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" name="da_user_id" value="{{.DaUserID}}">
                    </div>

                    <h3 class="mb-3 text-warning">Параметры рулетки</h3>

                    <!-- Цена прокрутки -->
                     <div class="mb-3">
                        <label class="form-label">Цена прокрутки:</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" name="min_amount_one_spin" value="{{.MinAmountOneSpin}}">
                    </div>

                    <!-- Таймаут перед срабатыванием -->
                     <div class="mb-3">
                        <label class="form-label">Таймаут перед срабатыванием:</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" name="start_delay_seconds" value="{{.StartDelaySeconds}}">
                    </div>

                    <!-- Остаток последнего доната -->
                    <!--div class="mb-3">
                        <label class="form-label">DA ID пользователя:</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" name="da_user_id" value="{{.DaUserID}}">
                    </div-->

                    <button type="submit" class="btn btn-primary w-100 fw-bold">Сохранить настройки</button>
                </form>
            </div>
        </div>

        <!-- ТАБ 2: Загрузка новых шаблонов -->
        <div class="tab-pane fade" id="templates-content" role="tabpanel">
            <div class="card p-4 shadow">
                <h3 class="mb-3 text-warning">Загрузить новый дизайн рулетки</h3>
                <!-- enctype="multipart/form-data" ОБЯЗАТЕЛЕН для загрузки файлов -->
                <form action="/admin/upload-template" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Название шаблона (латиницей, без пробелов):</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" name="template_name" placeholder="например: cyberpunk_wheel" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Выбрать файлы оформления (разрешено выбрать сразу несколько):</label>
                        <!-- тег multiple позволяет стримеру выделить сразу index.html, style.css и script.js -->
                        <input type="file" class="form-control bg-dark text-white border-secondary" name="template_files" multiple required>
                        <div class="form-text text-muted">Выделите одновременно файлы .html, .css, .js и картинки</div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold">🚀 Установить шаблон в систему</button>
                </form>
            </div>
        </div>

        <!-- ТАБ 3: Ручной запуск -->
        <div class="tab-pane fade" id="manual-content" role="tabpanel">
            <div class="card p-4 shadow text-center">
                <h3 class="mb-3 text-warning">Управление эфиром</h3>
                <p>Здесь можно протестировать анимацию или запустить рулетку вручную для крафта.</p>
                <button class="btn btn-danger btn-lg w-100 fw-bold mb-3" onclick="triggerSpin()">🎰 Запустить 1 тестовый прокрут</button>
            </div>
        </div>

    </div>

    <a href="/api/shutdown" class="btn btn-danger btn-sm" onclick="return confirm('Вы уверены, что хотите остановить сервер рулетки?')">
        Выключить сервер
    </a>
</div>

<!-- Подключаем JavaScript от Bootstrap, чтобы табы переключались сами по клику -->
<script src="/static/bootstrap.bundle.min.js"></script>
<script>
    function triggerSpin() {
        // Тут будет наш микро-скрипт отправки команды на Go сервер
        console.log("Крутим!");
    }
</script>
</body>
</html>
