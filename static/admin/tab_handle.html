<h4 class="mb-3">Управление наградами и ручным запуском</h4>

<!-- БЛОК 1: ИМПОРТ -->
<div class="card mb-4 border-primary shadow-sm">
    <div class="card-header bg-primary text-white font-weight-bold">
        📥 Импортировать награды из Google Spreadsheets
    </div>
    <div class="card-body">
        <form action="/import-prizes" method="POST" class="row g-3 align-items-center">
            <div class="col-md-9">
                <input type="url" class="form-control" name="google_sheets_url" 
                    placeholder="https://google.com" required>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100">🔄 Импортировать</button>
            </div>
        </form>
        <div class="form-text text-muted mt-2">
            Ссылка не сохраняется в конфигурационный файл на сервере и удерживается только в текущей сессии.
        </div>
    </div>
</div>

<!-- БЛОК 2: СОЗДАНИЕ И РЕДАКТИРОВАНИЕ -->
<div class="card mb-4 border-secondary shadow-sm">
    <div class="card-header bg-secondary text-white font-weight-bold">
        🛠 Создание и редактирование наград
    </div>
    <div class="card-body">
        <form action="/save-prizes-list" method="POST" id="prizesForm">
            <div id="prizesContainer">
                <!-- Динамически выводим текущие награды из стейта -->
                {{range $index, $prize := .Prizes}}
                <div class="row g-2 mb-2 prize-row align-items-center">
                    <div class="col-md-5">
                        <input type="text" class="form-control" name="prize_name[]" value="{{$prize.Name}}" placeholder="Награда" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" name="prize_category[]" value="{{$prize.Category}}" placeholder="Категория (Редкость)" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" class="form-control" name="prize_weight[]" value="{{$prize.Weight}}" placeholder="Процент / Вес" min="1" required>
                    </div>
                    <div class="col-md-1 text-end">
                        <button type="button" class="btn btn-danger btn-sm w-100" onclick="removeRow(this)">✕</button>
                    </div>
                </div>
                {{end}}
            </div>
            
            <div class="mt-3 d-flex justify-content-between">
                <button type="button" class="btn btn-outline-success" onclick="addRow()">➕ Добавить награду</button>
                <button type="submit" class="btn btn-success px-4">💾 Сохранить список</button>
            </div>
        </form>
    </div>
</div>

<!-- БЛОК 3: ЗАПУСК ВРУЧНУЮ -->
<div class="card border-warning shadow-sm">
    <div class="card-header bg-warning text-dark font-weight-bold">
        🚀 Запуск вручную
    </div>
    <div class="card-body">
        <form action="/save-manual" method="POST" class="row g-3 align-items-center">
            <div class="col-md-4">
                <label for="categorySelect" class="form-label mb-0 fw-bold">Выбор категории:</label>
            </div>
            <div class="col-md-5">
                <select class="form-select" id="categorySelect" name="category" required>
                    <option value="all" selected>🎲 [Все категории]</option>
                    {{range .Categories}}
                        <option value="{{.}}">🎯 {{.}}</option>
                    {{end}}
                </select>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">Запустить</button>
            </div>
        </form>
    </div>
</div>

<!-- Скрипт для динамического добавления/удаления строк наград прямо в браузере -->
<script>
function addRow() {
    const container = document.getElementById('prizesContainer');
    const row = document.createElement('div');
    row.className = 'row g-2 mb-2 prize-row align-items-center';
    row.innerHTML = `
        <div class="col-md-5">
            <input type="text" class="form-control" name="prize_name[]" placeholder="Награда" required>
        </div>
        <div class="col-md-4">
            <input type="text" class="form-control" name="prize_category[]" placeholder="Категория (Редкость)" required>
        </div>
        <div class="col-md-2">
            <input type="number" class="form-control" name="prize_weight[]" value="1" placeholder="Процент / Вес" min="1" required>
        </div>
        <div class="col-md-1 text-end">
            <button type="button" class="btn btn-danger btn-sm w-100" onclick="removeRow(this)">✕</button>
        </div>
    `;
    container.appendChild(row);
}

function removeRow(button) {
    const row = button.closest('.prize-row');
    row.remove();
}
</script>
